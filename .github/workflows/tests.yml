name: Teste Automate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Instaleaza Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaleaza dependente
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ruleaza testele
        run: pytest test_server.py -v
